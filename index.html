<!DOCTYPE html>
<html lang="fr">

<head>

<p id="restaurant-address"></p>
  <p id="restaurant-phone"></p>
  <p id="restaurant-livraison"></p>

  <div class="liens-restaurant">

<button id="btn-itineraire">
📍 Itinéraire
</button>

<button id="btn-appel">
📞 Appeler
</button>

<button id="btn-site">
🌐 Site Web
</button>

<button id="btn-instagram">
📸 Instagram
</button>

<button id="btn-facebook">
👍 Facebook
</button>

<div>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Restaurant Atlas</title>

<link rel="stylesheet" href="style.css">
  
</head>

<body>

<header>

<img
src="images/logo.png"
class="logo"
alt="Logo Restaurant">

<h1 id="restaurant-name">
Chargement...
</h1>

<p id="restaurant-address"></p>

<p id="restaurant-phone"></p>
  
</header>

<img
src="images/banner.jpg"
class="banner"
alt="Bannière Restaurant">

<div class="search">

<input
type="text"
id="search"
placeholder="🔍 Rechercher un plat">

<button onclick="toggleDarkMode()">
🌙 Mode sombre
</button>
  
</div>

<div
id="categories"
class="categories">
</div>

<div class="langues">

<button onclick="changerLangue('fr')">
🇫🇷
</button>

<button onclick="changerLangue('ar')">
🇲🇦
</button>

<button onclick="changerLangue('en')">
🇬🇧
</button>


</div>
  
<div id="cart-badge" class="cart-badge">
🛒 <span id="cart-count">0</span>
</div>
  
<div id="menu">
</div>

<div class="panier">

<div id="panier-contenu">
Panier vide
</div>

<h2>

Total :
<span id="total">0</span>
DH

</h2>

<button
class="whatsapp"
onclick="commander()">

📱 Commander sur WhatsApp

</button>

</div>

<script
type="module"
src="app.js">
</script>
  
</body>

</html>
