<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Administration Restaurant Atlas</title>

<style>

body{
font-family:Arial,sans-serif;
padding:20px;
background:#f5f5f5;
}

.section{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input[type="text"],
input[type="number"],
select{
width:100%;
padding:10px;
margin:5px 0;
}

input[type="checkbox"]{
width:auto;
margin-right:10px;
}

button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

.ajouter{
background:#27ae60;
color:white;
}

.produit{
padding:10px;
border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<h1>⚙️ Administration</h1>

<div class="section">

<h2>📂 Ajouter une catégorie</h2>

<input
id="categorieNom"
placeholder="Nom de la catégorie">

<button
class="ajouter"
onclick="ajouterCategorie()">

Ajouter catégorie

</button>

</div>

<div class="section">

<h2>🍔 Ajouter un produit</h2>

<select id="categorieSelect"></select>

<input id="nomFr" placeholder="Nom Français">

<input id="nomAr" placeholder="Nom Arabe">

<input id="nomEn" placeholder="Nom Anglais">

<input id="descFr" placeholder="Description Français">

<input id="descAr" placeholder="Description Arabe">

<input id="descEn" placeholder="Description Anglais">
  
<input
id="prixProduit"
type="number"
placeholder="Prix">

<input
id="promoProduit"
type="number"
placeholder="Promo">

<input
id="imageProduit"
placeholder="images/photo.jpg">

  <label>
<input
type="checkbox"
id="produitPopulaire">

Produit populaire
</label>

<label>
<input
type="checkbox"
id="produitDisponible"
checked>

Disponible
</label>

<button
class="ajouter"
onclick="ajouterProduit()">

Ajouter produit

</button>

</div>

<div class="section">

<h2>📋 Produits existants</h2>

<div id="listeProduits"></div>

</div>

  <div class="section">

<button
onclick="exporterJSON()"
class="ajouter">

💾 Exporter menu.json

  <button
class="ajouter"
onclick="sauvegarderCloud()">

☁️ Sauvegarder en ligne

</button>

</button>

  </div>

<script
type="module"
src="admin.js">
</script>

</body>
</html>
