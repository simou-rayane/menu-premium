<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Administration Restaurant Atlas</title>

<style>

body{
font-family:Arial,sans-serif;
padding:20px;
background:#f5f5f5;
}

.section{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input,
select{
width:100%;
padding:10px;
margin:5px 0;
}

button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

.ajouter{
background:#27ae60;
color:white;
}

.produit{
padding:10px;
border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<h1>⚙️ Administration</h1>

<div class="section">

<h2>📂 Ajouter une catégorie</h2>

<input
id="categorieNom"
placeholder="Pizza">

<button
class="ajouter"
onclick="ajouterCategorie()">

Ajouter catégorie

</button>

</div>

<div class="section">

<h2>🍔 Ajouter un produit</h2>

<select id="categorieSelect"></select>

<input
id="nomProduit"
placeholder="Nom du produit">

<input
id="prixProduit"
type="number"
placeholder="Prix">

<input
id="promoProduit"
type="number"
placeholder="Promo">

<input
id="imageProduit"
placeholder="images/photo.jpg">

<button
class="ajouter"
onclick="ajouterProduit()">

Ajouter produit

</button>

</div>

<div class="section">

<h2>📋 Produits existants</h2>

<div id="listeProduits"></div>

</div>

<script src="admin.js"></script>

</body>
</html>
